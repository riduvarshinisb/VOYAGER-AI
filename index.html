<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyager AI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <div class="app-header">
      <h1 class="title">Voyager AI</h1>
      <p class="subtitle">Plan your next trip in minutes.</p>
    </div>

    <form id="trip-form" class="form">
      <div class="form-group">
        <label for="destination">DESTINATION</label>
        <input type="text" id="destination" placeholder="e.g. Paris, Tokyo, or Goa" required />
      </div>

      <div class="form-group">
        <label for="budget">BUDGET (IN ₹)</label>
        <input type="number" id="budget" placeholder="e.g. 1000" required />
      </div>

      <div class="form-group">
        <label for="days">DAYS</label>
        <input type="number" id="days" placeholder="e.g. 5" required />
      </div>

      <div class="form-group">
        <label for="preferences">PREFERENCES</label>
        <textarea id="preferences" placeholder="e.g. beaches, local food, adventure"></textarea>
      </div>

      <button type="submit" class="btn">GENERATE ITINERARY</button>
    </form>

    <div id="output" class="output hidden">
      <h2>Your Smart Itinerary</h2>
      <div id="itinerary-text"></div>
      <button id="download-pdf" class="btn hidden">DOWNLOAD AS PDF</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
